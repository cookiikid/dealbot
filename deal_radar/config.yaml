  # ---------------------------------------------------------------- prebuilts
  - id: prebuilt_flagship
    name: Prebuilt / used desktop with RTX 4090 or 5090
    category: prebuilt
    priority: 10            # wins over the bare-GPU profiles when PC evidence is present
    variant_required: true
    match:
      field: text
      all:
        - '\b(?:rtx\s*)?(?:4090|5090)\b'
        - '\b(?:gaming\s+(?:pc|computer|desktop|rig)|pc|desktop|computer|tower|prebuilt|pre-built|workstation|full\s+(?:build|system)|custom\s+build)\b'
        - '\b(?:i[579][\s-]?\d{4,5}[a-z]{0,2}|core\s+(?:ultra\s+)?[579]\s*\d{3,5}[a-z]{0,2}|ryzen\s+[579]\s*\d{4}x?3?d?|\d{4}x3d|threadripper|\d{2,3}\s*gb\s*(?:of\s+)?(?:ddr[45]|ram|memory))\b'
      none:
        - '\b(?:laptop|notebook)\b'
    variants:
      - id: gpu_5090
        field: text
        match: ['\b(?:rtx\s*)?5090\b']
        price: { reference_new: 4300, reference_used: 3500, floor: 900, target: 3000, ceiling: 4200 }
      - id: gpu_4090
        field: text
        match: ['\b(?:rtx\s*)?4090\b']
        price: { reference_new: 3300, reference_used: 2600, floor: 700, target: 2200, ceiling: 3100 }
    price:
      reference_new: 3300
      reference_used: 2600
      floor: 700
      target: 2200
      ceiling: 4200
    search:
      terms: ["4090 gaming pc", "5090 gaming pc"]
      ebay_category_ids: ["179"]
    vision_hint: a complete desktop PC tower (case with components), not just a GPU or an empty case
    tags: [prebuilt]

