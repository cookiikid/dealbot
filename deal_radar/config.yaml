  # ---------------------------------------------------------------- prebuilts
  - id: prebuilt_flagship
    name: Prebuilt / used desktop with RTX 4090 or 5090
    category: prebuilt
    priority: 10            # wins over the bare-GPU profiles when PC evidence is present
    variant_required: true
    match:
      field: text
      all:
        - '\b(?:rtx\s*-?\s*|geforce\s+)?(?:4090|5090)\b'
        # the PC-ness must be in the TITLE: a GPU listing that mentions its test system is not a prebuilt
        - '^[^\n]*\b(?:gaming\s+(?:pc|computer|desktop|rig|tower|system)|pc|desktop|computer|tower|prebuilt|pre-built|workstation|full\s+(?:build|system|setup)|custom\s+(?:build|pc|rig))\b'
        - '\b(?:i[3579][\s-]?\d{4,5}[a-z]{0,3}|core\s+(?:ultra\s+)?[3579]\s*-?\s*\d{3,5}[a-z]{0,3}|ryzen\s+[3579]\s*\d{4}x?3?d?|\d{4}x3d|threadripper|xeon|\d{2,3}\s*gb\s*(?:of\s+)?(?:ddr[45]|ram|system\s+memory))\b'
      none:
        - '\b(?:laptop|notebook)\b'
        - '\b(?:pulled|removed|taken)\s+(?:out\s+)?(?:from|of)\b'
        - '\btested\s+(?:in|on|with)\s+(?:my\s+|a\s+)?(?:pc|system|rig|build|bench|computer|desktop)\b|\btest\s*bench\b'
        - '^[^\n]*\b(?:gpu|card)\s+only\b'
        - '\b(?:upgrade|upgradable|upgradeable)\s+to\s+(?:an?\s+)?(?:rtx\s*)?(?:4090|5090)\b'
