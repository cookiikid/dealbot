# =============================================================================
#  DealRadar — master configuration
# =============================================================================
#  * Validated by deal_radar/config_schema.py (Pydantic v2, unknown keys rejected).
#    Check it any time with:  python -m deal_radar.main --check-config
#  * Secrets/node-specific values come from the environment via ${VAR},
#    ${VAR:-default} or ${VAR:?error}. Copy deploy/.env.example to .env.
#  * Regexes are Python `re` syntax, compiled case-insensitively. YAML single
#    quotes keep backslashes literal ('\b' is a regex word boundary).
#  * Adding a new product class = adding one block under `profiles:`.
# =============================================================================
version: 1

app:
  name: dealradar
  node_id: ${NODE_ID:-local-dev}
  # collector = run sources; processor = filter/score/dedup/dispatch.
  # GCP primary: "collector,processor"; home laptop (FB/OfferUp): "collector".
  roles: ${APP_ROLES:-collector,processor}
  log_level: ${LOG_LEVEL:-INFO}
  log_json: ${LOG_JSON:-false}
  timezone: ${APP_TIMEZONE:-America/New_York}
  dry_run: ${DRY_RUN:-false}

http_server:
  enabled: true
  host: 0.0.0.0
  port: ${HTTP_PORT:-8080}
  auth_token: ${HTTP_AUTH_TOKEN:-}

storage:
  # SQLite (WAL) is plenty for one processor; use Postgres for multiple processors:
  #   postgresql+asyncpg://dealradar:pass@10.0.0.5:5432/dealradar
  database_url: ${DATABASE_URL:-sqlite+aiosqlite:///data/dealradar.db}
  # Unset => single-node in-memory dedup. Set for distributed mode (Valkey/Redis 7+).
  redis_url: ${REDIS_URL:-}
  redis_key_prefix: "dr:"
  snapshot_batch_size: 200
  snapshot_flush_seconds: 2.0
  record_rejected: true
  retention_days: 120

bus:
  # memory = in-process queue (single node). redis = Redis Streams consumer group
  # (collector nodes XADD, processor nodes XREADGROUP).
  backend: ${BUS_BACKEND:-memory}
  stream_key: "stream:raw"
  group: processors
  maxlen: 100000
  block_ms: 1000
  batch_size: 64
  workers: 8

network:
  timeout_seconds: 10
  connect_timeout_seconds: 3
  max_connections: 200
  max_connections_per_host: 8
  dns_cache_ttl_seconds: 300
  keepalive_seconds: 60
  trust_env: true
  proxy: ${HTTP_PROXY_URL:-}
  identity_rotation_minutes: 45
  retry:
    max_attempts: 4
    base_delay_seconds: 0.4
    max_delay_seconds: 15
    max_total_seconds: 30
  # Politeness budgets per host (suffix match). Being blocked is the slowest outcome.
  default_host_limit: { rate_per_second: 2.0, burst: 4 }
  host_limits:
    api.ebay.com: { rate_per_second: 4.0, burst: 8 }
    oauth.reddit.com: { rate_per_second: 1.5, burst: 3 }   # 100 QPM per OAuth client
    www.reddit.com: { rate_per_second: 0.15, burst: 2 }     # unauthenticated: ~10 QPM
    slickdeals.net: { rate_per_second: 0.5, burst: 2 }
    api.bestbuy.com: { rate_per_second: 4.0, burst: 5 }    # official limit 5 QPS
    redsky.target.com: { rate_per_second: 1.0, burst: 2 }
    newegg.com: { rate_per_second: 0.5, burst: 1 }
    offerup.com: { rate_per_second: 0.3, burst: 1 }
    craigslist.org: { rate_per_second: 0.3, burst: 1 }
    discord.com: { rate_per_second: 2.0, burst: 5 }
    api.telegram.org: { rate_per_second: 10.0, burst: 20 }

# -----------------------------------------------------------------------------
#  Sources
# -----------------------------------------------------------------------------
sources:
  ebay:
    # Official Browse API (OAuth client-credentials). Free keys: developer.ebay.com
    enabled: ${EBAY_ENABLED:-false}
    client_id: ${EBAY_CLIENT_ID:-}
    client_secret: ${EBAY_CLIENT_SECRET:-}
    marketplace_id: EBAY_US
    delivery_country: US
    delivery_postal_code: ${HOME_ZIP:-}
    affiliate_campaign_id: ${EBAY_CAMPAIGN_ID:-}
    # Interval is auto-stretched so (queries x polls/day) stays inside this quota.
    daily_call_budget: 5000
    budget_safety_factor: 0.85
    poll_interval_seconds: 45
    limit: 100
    buying_options: [FIXED_PRICE, BEST_OFFER]
    max_concurrency: 4
    reliability: 0.95
    nodes: ${EBAY_NODES:-}

  reddit:
    # Without OAuth credentials the public JSON endpoints are used (10 QPM and
    # frequently 403'd from datacenter IPs) — create a free "script" app at
    # https://www.reddit.com/prefs/apps and set REDDIT_CLIENT_ID/SECRET.
    enabled: ${REDDIT_ENABLED:-true}
    client_id: ${REDDIT_CLIENT_ID:-}
    client_secret: ${REDDIT_CLIENT_SECRET:-}
    username: ${REDDIT_USERNAME:-}
    poll_interval_seconds: 6
    max_item_age_minutes: 240
    subreddits:
      - { name: buildapcsales, mode: deals, limit: 25 }
      - { name: hardwareswap, mode: swap, limit: 25 }
    hardwareswap_locations: []          # e.g. [USA-TX, USA-OK]; empty = nationwide
    reliability: 0.9
    lease_ttl_seconds: 45                # active/passive fail-over when Redis is configured

  slickdeals:
    enabled: ${SLICKDEALS_ENABLED:-true}
    poll_interval_seconds: 45
    max_item_age_minutes: 360
    feeds:
      - name: frontpage
        url: https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1
      - name: hot_deals_forum
        url: https://slickdeals.net/forums/external.php?type=rss2&forumids=9
    search_feeds_from_profiles: true
    reliability: 0.88
    lease_ttl_seconds: 120

  retail:
    # First-party price/inventory endpoints. Price errors show up here first.
    enabled: ${RETAIL_ENABLED:-false}
    poll_interval_seconds: 20
    max_concurrency: 6
    reliability: 1.0
    endpoints:
      - name: bestbuy_flagship_gpus
        adapter: bestbuy
        api_key: ${BESTBUY_API_KEY:-}
        profile_hint: rtx_5090
        # Example SKUs (verify on bestbuy.com — SKUs change with new revisions):
        # 6614151 RTX 5090 Founders Edition
        skus: ["6614151"]
        poll_interval_seconds: 15
      # Shopify storefronts expose /products/<handle>.js without auth. Example:
      # - name: example_shopify_store
      #   adapter: shopify
      #   retailer: Example Store
      #   store_url: https://example-store.com
      #   handles: [nvidia-geforce-rtx-5090-founders-edition]
      #   cache_bust: true
      # Any JSON API can be mapped without code:
      # - name: custom_json_api
      #   adapter: json
      #   retailer: Example
      #   url: https://api.example.com/v1/products?category=gpu
      #   items_path: data.products
      #   fields: { id: sku, title: name, price: pricing.current, list_price: pricing.regular,
      #             in_stock: inventory.available, url: links.web, image: images[0].url }

  fb_marketplace:
    # Runs a real Chromium with a persisted logged-in session. Run it on a HOME
    # connection (residential IP) — datacenter IPs trigger checkpoints quickly.
    enabled: ${FB_ENABLED:-false}
    nodes: ${FB_NODES:-}
    poll_interval_seconds: 240
    cooldown_seconds: 1800
    max_item_age_minutes: 1440
    days_since_listed: 1
    max_listings_per_query: 40
    scrolls_per_query: 1
    checkpoint_pause_minutes: 180
    reliability: 0.7
    location:
      latitude: ${HOME_LAT:-40.7128}
      longitude: ${HOME_LON:--74.0060}
      city_slug: ${FB_CITY_SLUG:-nyc}
      radius_km: ${FB_RADIUS_KM:-60}
      timezone_id: ${APP_TIMEZONE:-America/New_York}
      locale: en-US
      postal_code: ${HOME_ZIP:-}
    browser:
      headless: ${FB_HEADLESS:-true}
      storage_state_path: ${FB_STORAGE_STATE:-data/fb_storage_state.json}
      proxy: ${FB_PROXY:-}
      min_action_delay_seconds: 1.5
      max_action_delay_seconds: 4.5

  offerup:
    enabled: ${OFFERUP_ENABLED:-false}
    nodes: ${OFFERUP_NODES:-}
    poll_interval_seconds: 180
    latitude: ${HOME_LAT:-}
    longitude: ${HOME_LON:-}
    zip_code: ${HOME_ZIP:-}
    radius_miles: 30
    reliability: 0.7

  craigslist:
    enabled: ${CRAIGSLIST_ENABLED:-false}
    poll_interval_seconds: 300
    sites: [newyork]
    postal_code: ${HOME_ZIP:-}
    search_distance_miles: 40
    reliability: 0.65

# -----------------------------------------------------------------------------
#  Deterministic text filters (engine/text_filter.py)
#  action: reject  -> hard reject on match
#  action: risk    -> adds a RiskSignal with `probability` (combined by noisy-OR)
#  negatable: true -> matches preceded (within negation_window_words, same clause)
#                     by a negation term are ignored ("no cracks", "never mined")
# -----------------------------------------------------------------------------
filters:
  # Negation applies to `negatable` groups only: a match is ignored when one of these
  # terms ends within the previous `negation_window_words` words of the same clause
  # ("no dead pixels", "never been mined", "w/o burn-in", "isn't cracked"), or when
  # the match is answered form-style ("Dead pixels: none"). Scope enders such as
  # "box"/"returns" detach a negation from what follows ("no box cracked screen").
  negation_terms: ["no", "not", "never", "zero", "without", "w/o", "nothing", "isn't", "wasn't", "hasn't",
                   "haven't", "doesn't", "didn't", "free of", "none", "0", "non"]
  negation_window_words: 4
  min_title_length: 6
  allowed_currencies: [USD]
  # Groups run in this order; the first matching `reject` group wins.
  # Matching is case-insensitive. Patterns are written so that every match starts
  # with a literal word where possible: the filter derives literal "anchors" from
  # them and skips groups whose anchors do not occur in the listing at all.
  rules:
    box_only:
      action: reject
      description: Packaging sold without the product (classic eBay/FB bait)
      patterns:
        # "box only" / "box-only" - but not "no box only the card", "no original box only card"
        - '(?<!\bno\s)(?<!\bnot\s)(?<!\bno\soriginal\s)(?<!\bno\sretail\s)\bbox[\s-]*(?:only|alone)\b'
        - '\bempty\s+(?:retail\s+|original\s+|oem\s+)?box(?:es)?\b'
        # "just the box" / "only the original box" (not "comes with just the box", "only the box is dented")
        - '(?<!\bwith\s)(?<!\bincludes\s)(?<!\bincluding\s)\b(?:just|only)\s+(?:the\s+)?(?:retail\s+|original\s+|empty\s+)?(?:box|packaging)\b(?!\s+(?:is|was|has|and\s+(?:the\s+)?(?:card|gpu|tv|monitor)))'
        - '\b(?:box|packaging)\s+(?:and|&|\+)\s+(?:packaging|manuals?|accessories|inserts?|foam|papers|paperwork)\s+only\b'
        - '\bpackaging\s+only\b'
        - '\b(?:box|packaging)\s+(?:for|of)\s+(?:an?\s+|the\s+)?(?:nvidia\s+|geforce\s+)?(?:rtx|gtx|lg\s+(?:oled|c[4-6]|g[4-6])|samsung\s+(?:s90|qn)|alienware|steam\s+deck|sony\s+a7)'
        - '\b(?:gpu|card|graphics\s+card|tv|television|monitor|console|camera|item|unit)\s+(?:is\s+)?not\s+included\b'
        - '\bno\s+(?:gpu|graphics\s+card|card|tv|television|monitor|camera|console)\s+(?:is\s+)?included\b'
        - '\bdoes\s*(?:n[''’]?t|\s+not)\s+(?:include|come\s+with)\s+(?:the\s+|a\s+|an\s+)?(?:gpu|card|graphics\s+card|tv|television|monitor|camera|console)\b'
    photo_only:
      action: reject
      description: '"Picture of an RTX 4090" listings'
      patterns:
        - '(?<!\bstock\s)(?<!\breference\s)(?<!\bexample\s)(?<!\bsample\s)\b(?:photo|picture|image|pic|print|poster|drawing|jpe?g|png)\s+only\b'
        - '\b(?:you\s+(?:are|will\s+be|r)\s+(?:buying|purchasing|receiving|getting|bidding\s+on)|you\s+(?:will\s+)?(?:get|receive))\s+(?:a\s+|an\s+|the\s+|one\s+)?(?:photo|picture|image|print|poster|drawing|digital\s+(?:photo|image|file|download))\b'
        - '\bthis\s+(?:listing\s+|auction\s+|sale\s+)?is\s+(?:for\s+)?(?:a\s+|an\s+|the\s+)?(?:photo|picture|image|print|poster|drawing)\s+of\b'
        - '^\W*(?:an?\s+)?(?:photo|picture|image|drawing|painting|print|poster)\s+of\b'
        - '\bnot\s+(?:an?\s+)?(?:actual|real|physical)\s+(?:gpu|graphics\s+card|card|item|product|tv|television|monitor|camera|console|deck)\b'
    damaged:
      action: reject
      negatable: true
      description: Broken / for-parts / non-functional items (not packaging damage)
      patterns:
        - '\bfor\s+parts\b'
        - '\bparts\s+(?:only|or\s+repair|/\s*repair|and\s+repair|unit)\b'
        # damage words, unless they describe the box/packaging ("box is damaged", "cracked box", "broken seal")
        - '(?<!\bbox\s)(?<!\bbox\sis\s)(?<!\bbox\swas\s)(?<!\bbox\sgot\s)(?<!\bbox\sslightly\s)(?<!\bbox\sis\sslightly\s)(?<!\bbox\sa\sbit\s)(?<!\bbox\sis\sa\sbit\s)(?<!\bbox\sis\sa\slittle\s)(?<!\bboxes\s)(?<!\bboxes\sare\s)(?<!\bpackaging\s)(?<!\bpackaging\sis\s)(?<!\bpackaging\swas\s)(?<!\bred\s)\b(?:broken|cracked|shattered|smashed|bricked|dead|defective|faulty|damaged|burnt|burned|melted|fried|busted)\b(?![\s-]+(?:box|boxes|packaging|retail\s+box|seal|tape|bag|shipping\s+box|corner\s+of\s+(?:the\s+)?box|island|space|redemption|cells|by\s+daylight))'
        # explicit damaged parts (also catches "open box cracked screen")
        - '\b(?:cracked|broken|shattered|smashed|damaged|dead|stuck|burnt|burned|melted|bent)\s+(?:screen|panel|display|lcd|glass|pcb|board|connector|power\s+connector|12vhpwr|pins?|port|fans?|chip|die|core|pixels?)\b'
        - '\bnot\s+(?:working|functional|functioning|turning\s+on|powering\s+on|posting|booting|detected|recognized|recognised|displaying)\b'
        - '\bnon[\s-]?(?:working|functional|functioning)\b'
        - '\b(?:does|did|do)\s*(?:n[''’]?t|\s+not)\s+(?:work|post|boot|turn\s+on|power\s+on|power\s+up|power(?!\s+(?:off|down|cycle|throttle|limit))|display(?!\s+(?:any|artifacts?|lines?|issues?|problems?|signs?|dead|flicker\w*|burn)))\b'
        - '\b(?:won[''’]?t|will\s+not|can[''’]?t|cannot|could\s*n[''’]?t|unable\s+to)\s+(?:power\s+on|power\s+up|post|turn\s+on|boot|display\s+(?:anything|an?\s+image|a\s+picture|video))\b'
        - '\bno\s+(?:display|signal|video\s+(?:output|signal)|power|post)\b(?![\s-]+(?:issues?|problems?|defects?|artifacts?|dead|lines?|burn|scratch\w*|damage|marks?|flicker\w*|stuck|retention|cables?|cords?|adapters?|supply|brick|port|included))(?!-)'
        - '\b(?:vertical|horizontal)\s+(?:lines?|bands?|stripes?)\b'
        - '\blines?\s+(?:on|across|in)\s+(?:the\s+)?(?:screen|panel|display)\b'
        - '\b(?:stuck|bright|hot)\s+pixels?\b'
        - '\bburn(?:ed|t)?[\s-]?in\b(?![\s-]*(?:test|tested|testing|stress|period))'
        - '\bscreen\s+burn\b'
        - '\bartifact(?:s|ing)\b'
        - '\b(?:needs?|requires?)\s+(?:a\s+)?(?:repair|fixing|fix|new\s+(?:panel|screen|board|fan|fans))\b'
        - '\b(?:water|liquid|physical|screen|panel|pcb|board)\s+damage(?:d)?\b'
        - '\bdamage\s+(?:to|on)\s+(?:the\s+)?(?:screen|panel|pcb|board|connector|card|display)\b'
        - '\b(?:hairline\s+)?cracks?\s+(?:in|on|across)\s+(?:the\s+)?(?:screen|panel|display|pcb|board|glass|lcd)\b'
        - '\bfans?\s+(?:not\s+spinning|(?:do|does|did)\s*(?:n[''’]?t|\s+not)\s+spin|won[''’]?t\s+spin|grinding|rattl\w+)\b'
        - '\b(?:crash(?:es|ing)?|black\s+screens?)\s+(?:under|in|during|when)\s+(?:load|gaming|games?|benchmarks?)\b'
        - '\b(?:overheats?|overheating)\b'
    counterfeit:
      action: reject
      negatable: true
      description: Fake / relabelled hardware
      patterns:
        - '\b(?:fake|counterfeit|clone|knock-?off|relabell?ed|re-?branded)\s+(?:nvidia\s+|geforce\s+)?(?:rtx|gtx|gpu|graphics\s+card|card|tv|monitor|camera)\b'
        - '\b(?:rtx|gpu|card)\s+is\s+(?:a\s+)?(?:fake|counterfeit|clone|relabell?ed)\b'
    rental:
      action: reject
      description: GPU/compute rentals, hosting, mining contracts
      patterns:
        - '\brent(?:al|als|ing)\b'
        - '^\W*rent\b'
        - '\brent\s+(?:my|our|a|an|this|these|it|out|by|per|one|your|gpus?|cards?|rigs?|servers?|compute)\b'
        # "for rent" - not "money for rent", "pay for rent"
        - '(?<!\bmoney\s)(?<!\bcash\s)(?<!\bpay\s)(?<!\bpaying\s)\bfor\s+rent\b'
        - '\bfor\s+lease\b|\bleasing\b|\blease\s+(?:my|a|an|this|it|out|per)\b'
        - '\$\s*\d[\d,.]*\s*(?:/|per\s+|an?\s+)\s*(?:hr|hrs|hour|day|wk|week)\b'
        # monthly prices are rentals unless they are financing offers ("$108/mo with Affirm")
        - '\$\s*\d[\d,.]*\s*(?:/|per\s+|an?\s+)\s*(?:mo|month)\b(?![^\n.]{0,48}\b(?:financ\w*|affirm|klarna|afterpay|apr|installments?|payments?|months?|mos)\b)'
        - '\b(?:per|by\s+the)\s+hour\b|\bhourly\s+(?:rate|rental|basis)\b'
        - '\b(?:cloud|hosted)\s+(?:gpus?|compute|servers?|access|instances?)\b'
        - '\b(?:remote|virtual|dedicated)\s+(?:gpus?|compute|gpu\s+servers?|instances?)\b'
        - '\bgpu\s+(?:hosting|cloud|server\s+access|time|hours|rental|instances?)\b'
        - '\b(?:mining|compute)\s+(?:contract|hosting|pool\s+share|rental)\b'
        - '\bhash\s*(?:rate|power)\s+(?:rental|contract|for\s+sale)\b'
        - '\b(?:vast\.ai|runpod|tensordock|lambda\s+labs?|salad\.com|paperspace)\b'
    wanted:
      action: reject
      field: title
      description: Buy / trade requests, not offers
      patterns:
        - '^\W*(?:wtb|wtt|iso|lf|lfm|looking\s+(?:for|to\s+buy)|in\s+search\s+of|searching\s+for|seeking|want(?:ed|ing)?\s+to\s+buy|wanted\b(?!\s+gone)|want\b(?!\s+(?:to\s+sell|gone|it\s+gone))|buying\b|need\b(?!\s+(?:gone|it\s+gone|cash|money|to\s+sell|sold)))'
        - '\b(?:wtb|iso)\b(?!\s*:?\s*\d)'
        - '\blooking\s+to\s+buy\b|\bpaying\s+(?:top|cash|good|fair)\b'
        # r/hardwareswap: [H] money [W] item, or [W] a GPU
        - '\[\s*h\s*\]\s*(?:pay\s*pal|paypal|cash|local\s+cash|venmo|zelle|money|\$)'
        - '\[\s*w\s*\]\s*(?:an?\s+)?(?:nvidia\s+)?(?:rtx|gtx|geforce|rx|radeon|lg|oled|sony|steam\s+deck)\b'
    accessory:
      action: reject
      field: title
      description: Accessories/parts for the product rather than the product
      patterns:
        - '\b(?:for|fits|compatible\s+with|designed\s+for|made\s+for)\s+(?:an?\s+|the\s+|your\s+)?(?:nvidia\s+|geforce\s+|asus\s+|msi\s+|gigabyte\s+|zotac\s+|evga\s+|pny\s+|lg\s+|samsung\s+|alienware\s+|dell\s+|sony\s+|valve\s+)?(?:rtx|gtx|rx\s*\d|oled|c[1-6]\b|g[1-6]\b|aw\d|a7|alpha\s*7|steam\s+deck|pg\d{2}|s9\d[df])'
        - '\b(?:water\s*block|waterblock|backplate|back\s+plate|shroud|heat\s*sink|cooler|fans?|bracket|riser|cables?|adapters?|thermal\s+pads?|stand|base|mount|remote|power\s+(?:supply|board|cable)|psu|t-?con(?:\s+board)?|main\s*board|motherboard|screen\s+protector|case|skin|decal|sticker|battery|grip|charger|dock|lens\s+cap|body\s+cap)\s+(?:only|for)\b'
        - '\b(?:replacement|spare)\s+(?:fans?|shroud|cooler|heat\s*sink|stand|remote|board|t-?con|power\s+board|main\s*board|panel|screen|lcd|battery|charger|backplate|bracket|cables?|joysticks?|thumbsticks?)\b'
        - '\b(?:replica|dummy|mock[\s-]?up|prop|toy|keychain|key\s+chain|figurine|t-?shirt|mug|miniature|scale\s+model)\b'
        # a title that ENDS with a part name and lists nothing else ("RTX 4090 FE shroud")
        - '^(?!.*(?:\bwith\b|\bw/|\bincl|\band\b|\bplus\b|\binstalled\b|[+&,]))[^\n]*\b(?:shroud|backplate|back\s*plate|heat\s*sink|t-?con(?:\s+board)?|main\s*board|power\s+board)\W*$'
    sold_marker:
      action: reject
      field: title
      description: Listing already sold / pending
      patterns:
        - '^\W*(?:sold|pending|on\s+hold|reserved|closed)\b(?!\s+(?:as[\s-]?is|separately|by|with|in|on|to|out\s+(?:everywhere|at)))'
        - '\b(?:sold|pending|closed)\W*$'
        - '[\[(]\s*(?:sold|pending|closed|on\s+hold|reserved|sale\s+pending|spf)\s*[\])]'
        - '\bno\s+longer\s+available\b|\bsale\s+pending\b'
    gift_card:
      action: reject
      field: title
      description: Gift cards / coupons (not a bundled gift card promo)
      patterns:
        - '^\W*(?:\$?\d[\d,.]*\s*(?:usd\s+)?)?(?:[\w&''-]+\s+){0,3}(?:e-?)?gift\s*cards?\b'
        - '\bgift\s*cards?\s+(?:only|for\s+sale|code|balance)\b'
        - '^\W*(?:\$?\d[\d,.]*\s*%?\s*(?:off\s+)?)?(?:[\w&''-]+\s+){0,2}(?:voucher|coupon|promo\s+code|discount\s+code|e-?gift)\b'
    payment_only_red_flag:
      action: risk
      probability: 0.6
      description: Irreversible payment demanded
      patterns:
        - '\b(?:zelle|cash\s*app|cashapp|venmo(?:\s+(?:friends\s+(?:and|&)\s+family|f&f|ff))?|apple\s+pay|wire(?:\s+transfer)?|western\s+union|moneygram|bitcoin|btc|crypto|usdt|gift\s*cards?|paypal\s+(?:friends\s+(?:and|&)\s+family|f&f|ff))\s+only\b'
        - '\bonly\s+(?:accept(?:ing)?\s+|take\s+|taking\s+)?(?:zelle|cash\s*app|cashapp|venmo|apple\s+pay|wire|crypto|bitcoin|btc|usdt|gift\s*cards?|paypal\s+(?:f&f|ff|friends))\b'
        - '\bpaypal\s+(?:friends\s+(?:and|&)\s+family|f\s*&\s*f|ff)\b'
        - '\b(?:no|not\s+accepting|don[''’]?t\s+accept)\s+(?:paypal\s+)?(?:g\s*&\s*s|goods\s+(?:and|&)\s+services)\b'
    payment_mention:
      action: risk
      probability: 0.12
      source_kinds: [local]
      description: Irreversible payment method mentioned on a local listing
      patterns:
        - '\b(?:zelle|cash\s*app|cashapp|western\s+union|moneygram|bitcoin|crypto)\b'
    deposit_request:
      action: risk
      probability: 0.55
      negatable: true
      description: Deposit / holding fee before seeing the item ("no deposits" is fine)
      patterns:
        - '\b(?:deposits?|down\s+payment|holding\s+fee|hold\s+fee)\b'
        - '\b(?:pay|send)\s+(?:a\s+|the\s+)?(?:deposit|half|50\s*%)\s+(?:first|upfront|up\s+front|before)\b'
        - '\bhold\s+(?:it|the\s+item|for\s+you)\s+(?:for\s+you\s+)?(?:with|for)\s+(?:a\s+)?(?:\$|payment|deposit)'
    off_platform_contact:
      action: risk
      probability: 0.35
      description: Pushes the conversation off the platform
      patterns:
        - '\b(?:text|call|email|e-mail|whats\s?app|telegram|signal|kik|wechat|contact)\s+me\s+(?:at|on|@|via)\b'
        - '\bwhats\s?app\b|\bwechat\b|\bt\.me/'
        - '(?<=[\w.+-])@(?:gmail|yahoo|hotmail|outlook|icloud|aol|proton(?:mail)?|gmx)\.(?:com|net|org|me|co)\b'
    phone_number:
      action: risk
      probability: 0.15
      description: Phone number in the listing text (off-platform contact)
      patterns:
        - '\(\d{3}\)\s?\d{3}[\s.-]\d{4}(?!\d)'
        # first digit, then a look-behind asserting it is not preceded by another digit
        - '\d(?<!\d\d)\d{2}[\s.-]\d{3}[\s.-]\d{4}(?!\d)'
    scam_story:
      action: risk
      probability: 0.35
      source_kinds: [local, marketplace]
      description: Classic remote-seller scam narratives
      patterns:
        - '\b(?:out\s+of\s+(?:town|state|the\s+country)|deployed|military\s+(?:deployment|base)|(?:moving|relocat(?:ed|ing))\s+(?:overseas|abroad|out\s+of\s+(?:state|the\s+country)))\b'
        - '\b(?:shipping|ship)\s+only\b|\bno\s+local\s+pick\s*-?\s*up\b|\b(?:will|can)\s+only\s+ship\b'
        - '\b(?:shipped|delivered|sent)\s+(?:by|via|through)\s+(?:fedex|ups|usps|dhl)\s+(?:agent|company|courier\s+service)\b'
        - '\b(?:my|the)\s+(?:shipping\s+)?(?:agent|courier)\s+will\b'
        - '\b(?:late|deceased)\s+(?:husband|son|father|dad|wife|brother)\b|\bpassed\s+away\b'
    read_description:
      action: risk
      probability: 0.2
      description: '"Read the description" - typical of box/photo bait (weak on its own)'
      patterns:
        - '\b(?:please\s+)?read\s+(?:the\s+)?(?:full\s+|entire\s+|whole\s+)?(?:description|listing|details|post)\b'
        - '\bsee\s+(?:the\s+)?description\b'
    untested_as_is:
      action: risk
      probability: 0.4
      negatable: true
      description: Seller cannot or will not vouch that it works
      patterns:
        - '\buntested\b|\bnot\s+tested\b'
        - '\b(?:unable|not\s+able)\s+to\s+test\b|\bcan[''’]?t\s+test\b|\bcannot\s+test\b|\bhaven[''’]?t\s+tested\b|\bno\s+way\s+to\s+test\b'
        - '\bsold\s+as[\s-]?is\b|\bas[\s-]is\b(?![\s,]+(?:new|in\s+new|brand))'
    no_returns:
      action: risk
      probability: 0.08
      source_kinds: [marketplace]
      description: No-returns policy on a marketplace listing (weak)
      patterns:
        - '\bno\s+returns?\b|\breturns?\s+not\s+accepted\b|\ball\s+sales\s+final\b'
    repaired_modified:
      action: risk
      probability: 0.25
      negatable: true
      description: Repaired, reworked or modified hardware
      patterns:
        - '\b(?:repaired|reflowed|reballed|re-?soldered|replaced\s+(?:connector|vram|memory|chip|panel|power\s+connector))\b'
        - '\b(?:bios\s+(?:flashed|modded|mod)|modded\s+bios|shunt\s+mod(?:ded)?|x-?flashed)\b'
    mining_history:
      action: risk
      probability: 0.08
      negatable: true
      categories: [gpu, workstation_gpu]
      description: Used for crypto mining (mild wear signal)
      patterns:
        - '\bmin(?:ed|ing)\b'
        - '\b(?:ex|former)[\s-]?miner\b'
    urgency:
      action: risk
      probability: 0.1
      description: Pressure to pay quickly
      patterns:
        - '\b(?:must\s+(?:sell|go)\s+(?:today|asap|now|tonight)|urgent(?:ly)?\s+(?:sale|selling)|need\s+(?:gone|cash)\s+(?:today|asap|fast))\b'

# -----------------------------------------------------------------------------
#  Anomaly scoring (engine/anomaly.py) — see docs/ARCHITECTURE.md §5
#    S = 100 · O · (λ + (1-λ)·C) · (1 - R)^γ
#    O = w_d·D + w_s·S_stat + w_t·T
# -----------------------------------------------------------------------------
scoring:
  weights: { discount: 0.45, statistical: 0.30, target: 0.25 }
  discount_saturation: 0.45       # 45% below market => D = 1
  z_low: 1.0                      # robust z below this contributes nothing
  z_high: 4.0                     # robust z at/above this saturates
  confidence_floor: 0.4           # λ: low confidence scales the score down to 40%, never to zero
  risk_exponent: 2.0              # γ: (1-R)^2 punishes risk super-linearly
  reject_risk: 0.85               # R >= this => hard reject as probable scam
  min_samples_for_stats: 6
  reference_prior_strength: 8     # n0: history needs ~8 effective samples to outweigh config refs
  history_half_life_days: 14      # depreciation-aware: old prices decay
  history_window_days: 60
  history_max_samples: 400
  history_max_risk: 0.5
  vision_trust_boost: 0.5
  price_error_discount: 0.5       # >= 50% below market on a trusted source = probable price error
  price_error_min_reliability: 0.9
  price_error_max_risk: 0.3
  extreme_discount_threshold: 0.55
  low_trust_reliability: 0.8
  min_seller_feedback: 5
  min_seller_feedback_pct: 97
  severity: { critical: 85, high: 70, medium: 55 }
  source_history_weights:
    retail: 1.0
    ebay: 0.8          # asking prices: weaker evidence than completed sales
    slickdeals: 1.0
    reddit: 0.9
    fb_marketplace: 0.6
    offerup: 0.6
    craigslist: 0.5

# -----------------------------------------------------------------------------
#  Local GPU vision validation (engine/vision_filter.py)
#  Runs on the RTX 3060 desktop (Ollama), reached over Tailscale.
# -----------------------------------------------------------------------------
vision:
  enabled: ${VISION_ENABLED:-false}
  backend: ${VISION_BACKEND:-ollama}          # ollama | openai (vLLM / llama.cpp / LM Studio)
  base_url: ${VISION_URL:-http://localhost:11434}
  model: ${VISION_MODEL:-qwen2.5vl:3b}
  escalation_model: ${VISION_ESCALATION_MODEL:-}
  api_key: ${VISION_API_KEY:-}
  timeout_seconds: 8
  max_concurrency: 2
  max_images: 2
  resize_max_side: 672
  jpeg_quality: 85
  keep_alive: 30m
  num_predict: 160
  apply_to_kinds: [local]
  min_prelim_score: 40
  negative_min_confidence: 0.6
  on_error: allow
  cache_ttl_seconds: 86400

dedup:
  listing_ttl_hours: 72       # re-alert window for the same listing
  cluster_ttl_hours: 12       # cross-source (same product+store+price) suppression
  min_drop_pct: 0.05          # re-alert a listing only if price drops >= 5% ...
  min_drop_abs: 10            # ... and >= $10
  price_bucket_pct: 0.02
  cross_source: true

# -----------------------------------------------------------------------------
#  Dispatch
# -----------------------------------------------------------------------------
dispatch:
  timeout_seconds: 6
  discord:
    webhooks:
      price_errors:
        webhook_url: ${DISCORD_WEBHOOK_PRICE_ERRORS:-}
        mention_role_id: ${DISCORD_ROLE_ID:-}
      gpu:
        webhook_url: ${DISCORD_WEBHOOK_GPU:-}
      displays:
        webhook_url: ${DISCORD_WEBHOOK_DISPLAYS:-}
      general:
        webhook_url: ${DISCORD_WEBHOOK_GENERAL:-}
      ops:
        webhook_url: ${DISCORD_WEBHOOK_OPS:-}
        link_buttons: false
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN:-}
    chats:
      main:
        chat_id: ${TELEGRAM_CHAT_ID:-}
        silent_below: high
  websocket:
    enabled: true
    path: /ws
    max_clients: 50
    recent_buffer: 200
  system_targets: [console, "discord:ops"]
  routes:
    - name: price_errors
      min_severity: high
      price_error_only: true
      mention: true
      targets: ["discord:price_errors", "telegram:main", websocket, console]
    - name: critical_everything
      min_severity: critical
      mention: true
      targets: ["discord:price_errors", "telegram:main", websocket, console]
    - name: gpus
      min_severity: medium
      categories: [gpu, workstation_gpu, prebuilt]
      max_per_minute: 20
      targets: ["discord:gpu", websocket, console]
    - name: gpus_phone
      min_severity: high
      categories: [gpu, workstation_gpu, prebuilt]
      targets: ["telegram:main"]
      quiet_hours: { start: "00:30", end: "07:30", min_severity: critical }
    - name: displays
      min_severity: medium
      categories: [monitor, tv]
      max_per_minute: 20
      targets: ["discord:displays", websocket, console]
    - name: everything_else
      min_severity: medium
      categories: [camera, handheld]
      targets: ["discord:general", websocket, console]

